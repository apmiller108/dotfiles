# Ghostty config. See `ghostty +show-config --default --docs` for every option,
# or https://ghostty.org/docs/config/reference
#
# Ported from shell/alacritty.toml. Reload in place with ctrl+shift+, (Ghostty
# has no live_config_reload equivalent; it reloads on that keybind instead).

font-family = JetBrains Mono
font-style = Regular
font-size = 14

# Color theme (Tokyo Night Storm variant)
# Original source https://github.com/zatchheems/tokyo-night-alacritty-theme
# Ghostty ships a built-in "TokyoNight Storm" theme, but its palette differs
# slightly from this one, so the exact colors are spelled out below.
background = #24283b
foreground = #a9b1d6

# normal
palette = 0=#32344a
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#ad8ee6
palette = 6=#449dab
palette = 7=#9699a8

# bright
palette = 8=#444b6a
palette = 9=#ff7a93
palette = 10=#b9f27c
palette = 11=#ff9e64
palette = 12=#7da6ff
palette = 13=#bb9af7
palette = 14=#0db9d7
palette = 15=#acb0d0

# Alacritty's "CellBackground" for cursor/selection text has no direct
# equivalent, so pin it to the background color.
cursor-color = #A1C6EA
cursor-text = #24283b
selection-background = #A1C6EA
selection-foreground = #24283b

cursor-style = bar
cursor-style-blink = false
adjust-cursor-thickness = 30%

# Alacritty: selection.save_to_clipboard
copy-on-select = clipboard

window-padding-x = 10
window-padding-y = 0

# Mac only; needed so ALT works as Meta in Emacs
macos-option-as-alt = true

# Send ESC + CR on shift+enter (multi-line input in REPLs, Claude Code, etc.)
keybind = shift+enter=esc:\r

# Alacritty's scrolling.history = 30000 has no analogue: Ghostty's
# scrollback-limit is a byte budget, not a line count. The 10MB default holds
# far more than 30k lines, so it's left alone.
